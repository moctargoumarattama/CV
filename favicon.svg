<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#142436"/>
      <stop offset="50%" stop-color="#091420"/>
      <stop offset="100%" stop-color="#030810"/>
    </linearGradient>
    <linearGradient id="topFace" x1="64" y1="24" x2="64" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a384e"/>
      <stop offset="100%" stop-color="#0c202e"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="28" y1="60" x2="64" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#122533"/>
      <stop offset="100%" stop-color="#08141c"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="64" y1="60" x2="100" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2b38"/>
      <stop offset="100%" stop-color="#06161e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <rect x="6" y="6" width="116" height="116" rx="28" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>

  <!-- Energy Ground Shadow / Ripple -->
  <ellipse cx="64" cy="106" rx="34" ry="10" fill="rgba(16,185,129,0.18)" filter="url(#glow)"/>

  <!-- 3D HOLOCUBE -->
  <!-- Top Face (Processeur MGA) -->
  <polygon points="64,26 98,44 64,62 30,44" fill="url(#topFace)" stroke="#f59e0b" stroke-width="2"/>
  <!-- MGA Chip on Top Face -->
  <polygon points="64,34 82,44 64,54 46,44" fill="#081622" stroke="#10b981" stroke-width="1.2"/>
  <text x="64" y="47" font-family="'Manrope', -apple-system, sans-serif" font-weight="900" font-size="11" fill="#f59e0b" text-anchor="middle" letter-spacing="1">MGA</text>

  <!-- Left Face (Solaire Photovoltaïque) -->
  <polygon points="30,44 64,62 64,98 30,80" fill="url(#leftFace)" stroke="#f59e0b" stroke-width="2"/>
  <!-- Solar Cells Grid -->
  <polygon points="35,51 46,57 46,67 35,61" fill="rgba(245,158,11,0.35)" stroke="#f59e0b" stroke-width="0.8"/>
  <polygon points="49,58 60,64 60,74 49,68" fill="rgba(245,158,11,0.35)" stroke="#f59e0b" stroke-width="0.8"/>
  <polygon points="35,65 46,71 46,81 35,75" fill="rgba(245,158,11,0.35)" stroke="#f59e0b" stroke-width="0.8"/>
  <polygon points="49,72 60,78 60,88 49,82" fill="rgba(245,158,11,0.35)" stroke="#f59e0b" stroke-width="0.8"/>

  <!-- Right Face (Éolienne & Aérodynamique) -->
  <polygon points="64,62 98,44 98,80 64,98" fill="url(#rightFace)" stroke="#38bdf8" stroke-width="2"/>
  <!-- Wind Turbine Rotor & Streamlines -->
  <g transform="translate(81, 71) scale(0.38)">
    <path d="M0 0 C0 -25, -6 -40, 0 -50 C6 -40, 4 -25, 0 0 Z" fill="#38bdf8"/>
    <path d="M0 0 C22 12, 38 15, 43 7 C38 0, 22 -3, 0 0 Z" fill="#38bdf8" transform="rotate(120)"/>
    <path d="M0 0 C-7 21, -16 37, -23 34 C-26 27, -12 14, 0 0 Z" fill="#38bdf8" transform="rotate(240)"/>
    <circle cx="0" cy="0" r="9" fill="#f59e0b"/>
    <circle cx="0" cy="0" r="4" fill="#040911"/>
  </g>
</svg>
